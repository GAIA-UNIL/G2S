name: C/C++ CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    # Everything except docs/ and example/ (deployed by github-pages.yml)
    # and the other workflow files. Later patterns override earlier ones.
    paths:
      - '**'
      - '!docs/**'
      - '!example/**'
      - '!.github/**'
      - '.github/workflows/ccpp.yml'

jobs:
  build-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 Linux, arm64 Linux and arm64 macOS
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update
        sudo apt install -y build-essential libzmq3-dev libjsoncpp-dev zlib1g-dev libfftw3-dev libomp-dev
        wget "https://raw.githubusercontent.com/zeromq/cppzmq/master/zmq.hpp" -O include/zmq.hpp

    - name: Install dependencies (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install zeromq jsoncpp zlib fftw cppzmq libomp curl
        wget "https://raw.githubusercontent.com/zeromq/cppzmq/master/zmq.hpp" -O include/zmq.hpp

    - name: Build project
      run: |
        cd build/
        make c++ -j

    - name: Run unit tests
      run: |
        ./build/c++-build/test -sampling 1D 2D 3D

    - name: Run QS kernel tests
      run: |
        make -C test/qs_kernels
        if [ "$(uname -m)" = "x86_64" ]; then
          for flags in "-msse3" "-mavx2 -mfma"; do
            make -C test/qs_kernels clean
            make -C test/qs_kernels SIMD_FLAGS="$flags"
          done
        fi

    - name: Build and test with SIMD FFTW
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        make -C build fftw-simd
        rm -f build/c++-build/*.o
        make -C build c++ -j
        ./build/c++-build/test -sampling 1D 2D 3D
