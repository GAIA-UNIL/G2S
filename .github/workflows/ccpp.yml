name: C/C++ CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    # Everything except docs/ and example/ (deployed by github-pages.yml)
    # and the other workflow files. Later patterns override earlier ones.
    paths:
      - '**'
      - '!docs/**'
      - '!example/**'
      - '!.github/**'
      - '.github/workflows/ccpp.yml'

jobs:
  build-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 Linux, arm64 Linux and arm64 macOS
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update
        sudo apt install -y build-essential libzmq3-dev libjsoncpp-dev zlib1g-dev libfftw3-dev libomp-dev
        wget "https://raw.githubusercontent.com/zeromq/cppzmq/master/zmq.hpp" -O include/zmq.hpp

    - name: Install dependencies (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install zeromq jsoncpp zlib fftw cppzmq libomp curl
        wget "https://raw.githubusercontent.com/zeromq/cppzmq/master/zmq.hpp" -O include/zmq.hpp

    - name: Build project
      run: |
        cd build/
        make c++ -j

    - name: Run unit tests
      run: |
        ./build/c++-build/test -sampling 1D 2D 3D

    - name: Run QS kernel tests
      run: |
        make -C test/qs_kernels
        if [ "$(uname -m)" = "x86_64" ]; then
          for flags in "-msse3" "-mavx2 -mfma"; do
            make -C test/qs_kernels clean
            make -C test/qs_kernels SIMD_FLAGS="$flags"
          done
        fi

    - name: Run geostat tests (covariance models, kriging, SGS, FFT-MA, turning bands, conditioning)
      run: |
        make -C test/geostat
        make -C test/geostat_kriging
        make -C test/geostat_sgs
        make -C test/geostat_fft
        make -C test/geostat_tb quick
        make -C test/geostat_conditioning
        if [ "$(uname -m)" = "x86_64" ]; then
          # The turning-bands kernels on AVX2 (the default x86 build is SSE2);
          # tb itself stays SSE2, so the executable check is skipped.
          make -C test/geostat_tb clean
          make -C test/geostat_tb quick SIMD_FLAGS="-mavx2 -mfma" TB=/nonexistent
          make -C test/geostat_tb clean
        fi

    - name: Set up Python for the covariance helper test
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run the Python covariance helper test (g2s.cov)
      run: |
        python -m pip install numpy
        cd build/python-build
        python -m unittest -v tests.test_cov

    - name: Build and test with SIMD FFTW
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        make -C build fftw-simd
        rm -f build/c++-build/*.o
        make -C build c++ -j
        ./build/c++-build/test -sampling 1D 2D 3D
        # FFT-MA / spectral determinism and conditioning against the SIMD FFTW (relinked).
        make -C test/geostat_fft clean
        make -C test/geostat_fft
        make -C test/geostat_conditioning clean
        make -C test/geostat_conditioning
